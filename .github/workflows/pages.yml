name: Deploy site to GitHub Pages

# Publishes:
#   /                -> site/index.html (links to the apps below)
#   /scrum-board/    -> scrum-board/ on main
#   /task-tracker/   -> task-tracker/ on main
#   /loop-planner/   -> loop-planner/ on main
#   /study-tracker/  -> study-tracker/ on the study-tracker branch
#
# The study tracker lives on its own branch, which doesn't contain this
# workflow, so pushing there does not redeploy. After updating it, run this
# workflow by hand (Actions tab -> "Deploy site to GitHub Pages" -> Run workflow).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scrum-board/**"
      - "task-tracker/**"
      - "loop-planner/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  STUDY_TRACKER_BRANCH: claude/study-tracker-app-paaho3

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Check out study tracker branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STUDY_TRACKER_BRANCH }}
          path: study
          sparse-checkout: study-tracker

      - name: Assemble site
        run: |
          mkdir _site
          cp main/site/index.html _site/
          cp -r main/scrum-board main/task-tracker main/loop-planner _site/
          cp -r study/study-tracker _site/
          touch _site/.nojekyll
          find _site -maxdepth 2 | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
